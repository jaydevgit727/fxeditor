name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Unzip project
        run: |
          unzip -o *.zip -d proj
          echo "PROJ=$(dirname $(find proj -name settings.gradle.kts | head -1))" >> $GITHUB_ENV
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FxEditor-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
